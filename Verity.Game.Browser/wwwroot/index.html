<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verity Browser Runtime</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      image-rendering: pixelated;
      outline: none;
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="verity-canvas" tabindex="0"></canvas>
  <pre id="verity-status" style="position:fixed;left:8px;top:8px;z-index:10;color:#fff;background:rgba(0,0,0,.7);padding:8px;max-width:60vw;white-space:pre-wrap;display:none;"></pre>
  <script type="module" src="./main.js?v=3"></script>
</body>
</html>
